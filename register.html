<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register webpage</title>
</head>
<body>
    <form action="registration" method="POST">
                <h2 class="heading">Student Registration Form</h2>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="name@example.com" required><br><br>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required><br><br>
                <label for="class-select">Select Class:</label><br>
                <select id="class-select" name="class">
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                </select><br><br>
             <style>
                .heading{
                    font-size: x-large;
                }
             </style>
            </form>
</body>
</html>
